# 增肌记录 fit.tsuibo.xyz —— 方案 A：Vue 静态产物 + 本机 API 反代
# 安装位置：/root/transfer/nginx/conf.d/fit.tsuibo.xyz.conf
# 生效：docker exec nginx nginx -t && docker exec nginx nginx -s reload
# *.tsuibo.xyz 已有通配 DNS 与通配 Origin 证书，无需改 DNS
#
# 切换前 fit.tsuibo.xyz 是「location / 全部反代到 127.0.0.1:8971」（前端 HTML 打在镜像里）。
# 切换后 / 走静态产物（改前端不再需要重建镜像），只有 /api/ 进容器。
# 回滚：把本文件换回 old vhost（只保留 upstream + location / 反代）并 reload。

upstream fitness_backend {
    server 127.0.0.1:8971;
    keepalive 32;
}

server {
    listen 81;
    server_name fit.example.com;  # ← 换成真实域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fit.example.com;  # ← 换成真实域名

    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/fitness-access.log;
    error_log  /var/log/nginx/fitness-error.log;

    root /usr/share/nginx/html/fitness;
    index index.html;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # CSR 由本服务自己发送；Element Plus 运行时注入样式，故 style-src 需 unsafe-inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 注意：nginx 的 add_header 不继承 —— 任何 location 里再写 add_header 会丢掉上面这几条，
    # 所以下面每个 location 都必须重复声明安全头（networth 上实测漏掉时 HTML/JS 上真没有 CSP）。
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # 入口文件不缓存，保证发版即时生效
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://fitness_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA history 模式回退（/train、/food 等深链直接打开）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
