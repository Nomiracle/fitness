<!DOCTYPE html>
<!-- fitness-app: routes=login,today,train,food,weight,plan mount=#app api=/api/{me,login,register,logout,export,import} -->
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="增肌记录 — 训练/饮食/体重记录与周评估" />
    <title>增肌记录</title>
    <style>
      /* 挂载前骨架屏：只有启动态，没有登录表单，天然不闪登录页（app 挂载时整块被替换） */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f1419;
        color: #eef2f7;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #app > .boot-splash {
        box-sizing: border-box;
        padding: 18px 12px 90px;
        max-width: 560px;
        margin: 0 auto;
      }
      .boot-splash .bs-title {
        font-size: 12px;
        color: #93a1b5;
        margin: 6px 0 14px;
      }
      .boot-splash .bs-bar {
        height: 46px;
        border-radius: 12px;
        margin-bottom: 12px;
        background: linear-gradient(90deg, #172032 25%, #1f2a40 37%, #172032 63%);
        background-size: 400% 100%;
        animation: bs-shimmer 1.4s ease-in-out infinite;
      }
      .boot-splash .bs-bar.tall {
        height: 96px;
      }
      .boot-splash .bs-bar.grid4 {
        height: 64px;
      }
      @keyframes bs-shimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-label="正在启动">
        <p class="bs-title">增肌记录 · 正在校验登录状态…</p>
        <div class="bs-bar tall"></div>
        <div class="bs-bar grid4"></div>
        <div class="bs-bar grid4"></div>
        <div class="bs-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
